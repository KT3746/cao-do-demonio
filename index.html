<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050814" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="TETROK — puzzle de blocos original. Encaixe peças, limpe linhas e suba de nível." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TETROK" />
    <meta property="og:title" content="TETROK" />
    <meta property="og:description" content="Arcade original, em português, para jogar no celular e no computador." />
    <meta property="og:type" content="website" />
    <title>TETROK</title>
    <link rel="icon" href="assets/favicon.svg?v=25-__CACHE__" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css?v=25-__CACHE__" />
  </head>
  <body class="theme-aurora skin-cyber">
    <div class="aurora" aria-hidden="true"></div>
    <div id="app">
      <header class="cyber-top">
        <button type="button" id="btn-pause" class="hex-btn" aria-pressed="false" title="Pausar" aria-label="Pausar">❚❚</button>
        <h1 class="cyber-title">TETROK</h1>
        <div class="cyber-top-right">
          <button type="button" id="btn-sound" class="hex-btn" aria-pressed="false" title="Som" aria-label="Som">♪</button>
          <button type="button" id="btn-theme" class="hex-btn" title="Visual" aria-label="Trocar visual">
            <span id="theme-label" class="sr-only">Aurora</span>◈
          </button>
        </div>
      </header>

      <div class="cyber-arena">
        <aside class="cyber-rail cyber-rail-left" aria-label="Placar">
          <div class="cyber-stat">
            <span>SCORE</span>
            <strong id="stat-score">0</strong>
          </div>
          <div class="cyber-stat">
            <span>LINES</span>
            <strong id="stat-lines">0</strong>
          </div>
          <div class="cyber-stat">
            <span>LEVEL</span>
            <strong id="stat-level">1</strong>
          </div>
          <div class="cyber-mini">
            <span>NEXT</span>
            <canvas id="next-side" width="88" height="88" aria-label="Próxima peça"></canvas>
          </div>
          <!-- mobile mirror ids -->
          <strong id="stat-score-m" class="sr-only">0</strong>
          <strong id="stat-level-m" class="sr-only">1</strong>
          <strong id="stat-lines-m" class="sr-only">0</strong>
        </aside>

        <main class="cyber-stage">
          <div id="board-wrap">
            <canvas id="board" width="300" height="600" role="img" aria-label="Tabuleiro do TETROK"></canvas>
          </div>
        </main>

        <aside class="cyber-rail cyber-rail-right" aria-label="Reserva e fila">
          <button type="button" id="pad-hold" class="cyber-mini hold-slot is-empty" data-action="hold" aria-label="HOLD / Reservar" title="Reservar (C)">
            <span>HOLD</span>
            <canvas id="hold" width="88" height="88" aria-hidden="true"></canvas>
            <span class="hold-empty">＋</span>
          </button>
          <div class="cyber-queue">
            <span>NEXT</span>
            <canvas id="next-0" width="72" height="56" aria-hidden="true"></canvas>
            <canvas id="next-1" width="72" height="56" aria-hidden="true"></canvas>
            <canvas id="next-2" width="72" height="56" aria-hidden="true"></canvas>
            <canvas id="next-3" width="72" height="56" aria-hidden="true"></canvas>
            <canvas id="next" width="72" height="56" aria-label="Fila de próximas"></canvas>
          </div>
          <canvas id="hold-m" class="sr-only" width="1" height="1" aria-hidden="true"></canvas>
          <canvas id="next-m" class="sr-only" width="1" height="1" aria-hidden="true"></canvas>
        </aside>
      </div>

      <nav class="touch cyber-pad" aria-label="Controles de toque">
        <div class="cyber-pad-inner">
          <div class="cyber-moves">
            <button type="button" id="pad-left" class="hex-pad" data-action="left" aria-label="Esquerda">◀</button>
            <button type="button" id="pad-right" class="hex-pad" data-action="right" aria-label="Direita">▶</button>
          </div>
          <button type="button" id="pad-soft" class="circle-drop" data-action="soft" aria-label="Descer">
            <span class="pad-icon" aria-hidden="true">▼</span>
            <span class="pad-caption">DESCER</span>
          </button>
          <button type="button" id="pad-rot" class="circle-rot" data-action="rotR" aria-label="Girar">
            <span class="pad-icon" aria-hidden="true">↻</span>
          </button>
        </div>
      </nav>

      <p class="desk-hint">PC: ← → mover · ↑ girar · ↓ descer · C reserva · P pausa</p>
    </div>

    <div id="howto" class="overlay howto" hidden role="dialog" aria-modal="true" aria-labelledby="howto-title">
      <div class="modal howto-modal">
        <h2 id="howto-title">TETROK</h2>
        <p id="howto-text"></p>
        <div id="howto-visual" class="howto-visual" hidden aria-hidden="true"></div>
        <div class="howto-dots" id="howto-dots" aria-hidden="true"></div>
        <button type="button" id="btn-howto-next" class="cta">Próximo</button>
        <button type="button" id="btn-howto-skip" class="linkish">Pular</button>
      </div>
    </div>

    <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <div class="modal cyber-modal">
        <h2 id="overlay-title">TETROK</h2>
        <p id="overlay-text" hidden></p>
        <div id="overlay-score" class="overlay-score" hidden></div>
        <div id="theme-picker" class="theme-picker" role="group" aria-label="Versão visual">
          <button type="button" class="theme-swatch is-on" data-theme="aurora" title="Aurora">
            <span class="swatch swatch-aurora"></span>
            <span>Aurora</span>
          </button>
          <button type="button" class="theme-swatch" data-theme="navy" title="Neon navy">
            <span class="swatch swatch-navy"></span>
            <span>Neon</span>
          </button>
          <button type="button" class="theme-swatch" data-theme="crimson" title="Vermelho profundo">
            <span class="swatch swatch-crimson"></span>
            <span>Vermelho</span>
          </button>
        </div>
        <button type="button" id="btn-play" class="cta">Jogar</button>
      </div>
    </div>

    <script type="module" src="js/main.js?v=25-__CACHE__"></script>
  </body>
</html>
